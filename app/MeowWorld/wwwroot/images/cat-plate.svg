<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img"
     aria-labelledby="catPlateTitle" preserveAspectRatio="xMidYMid slice">
  <title id="catPlateTitle">A cat sitting in an arched window at dusk</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#F6E7C4"/>
      <stop offset="46%"  stop-color="#E9C79A"/>
      <stop offset="100%" stop-color="#D08A63"/>
    </linearGradient>

    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#F4EEE3"/>
      <stop offset="100%" stop-color="#E6DCC9"/>
    </linearGradient>

    <linearGradient id="furBody" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0%"   stop-color="#24463C"/>
      <stop offset="100%" stop-color="#14302A"/>
    </linearGradient>

    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#F2E39A"/>
      <stop offset="100%" stop-color="#E4C56C"/>
    </radialGradient>

    <clipPath id="arch">
      <path d="M150 560 L150 236 A170 170 0 0 1 490 236 L490 560 Z"/>
    </clipPath>
  </defs>

  <!-- 壁 -->
  <rect width="800" height="640" fill="url(#wall)"/>

  <!-- 窓の中 -->
  <g clip-path="url(#arch)">
    <rect x="150" y="60" width="340" height="500" fill="url(#sky)"/>

    <!-- 夕日 -->
    <circle cx="395" cy="250" r="46" fill="url(#sun)" opacity="0.95"/>

    <!-- 遠景の丘 -->
    <path d="M150 470 Q235 404 320 452 Q405 500 490 448 L490 560 L150 560 Z"
          fill="#C2794F" opacity="0.55"/>
    <path d="M150 508 Q250 458 340 498 Q430 538 490 500 L490 560 L150 560 Z"
          fill="#A85F3C" opacity="0.65"/>

    <!-- 窓台 -->
    <rect x="150" y="524" width="340" height="36" fill="#8E4F32"/>

    <!-- 猫（座り姿・シルエット） -->
    <g>
      <!-- 尻尾 -->
      <path d="M392 524 q56 8 62 -42 q4 -34 -26 -36 q-22 -2 -20 20 q2 16 18 12"
            fill="none" stroke="url(#furBody)" stroke-width="19" stroke-linecap="round"/>
      <!-- 体 -->
      <path d="M258 524 q-6 -96 34 -132 q30 -27 62 -4 q42 31 36 136 Z" fill="url(#furBody)"/>
      <!-- 前脚 -->
      <rect x="286" y="486" width="19" height="40" rx="9" fill="#1B3A32"/>
      <rect x="320" y="486" width="19" height="40" rx="9" fill="#1B3A32"/>
      <!-- 頭 -->
      <circle cx="316" cy="374" r="52" fill="url(#furBody)"/>
      <!-- 耳 -->
      <path d="M272 340 l-6 -46 l42 22 Z" fill="#1B3A32"/>
      <path d="M360 340 l6 -46 l-42 22 Z" fill="#1B3A32"/>
      <path d="M277 336 l-3 -25 l22 12 Z" fill="#B4502C" opacity="0.75"/>
      <path d="M355 336 l3 -25 l-22 12 Z" fill="#B4502C" opacity="0.75"/>
      <!-- 目 -->
      <ellipse cx="298" cy="372" rx="7.5" ry="10" fill="#E9D98C"/>
      <ellipse cx="334" cy="372" rx="7.5" ry="10" fill="#E9D98C"/>
      <ellipse cx="298" cy="372" rx="2.6" ry="9" fill="#14302A"/>
      <ellipse cx="334" cy="372" rx="2.6" ry="9" fill="#14302A"/>
      <!-- 鼻と口 -->
      <path d="M316 388 l-6 5 h12 Z" fill="#D89A86"/>
      <path d="M316 393 q-8 10 -16 3 M316 393 q8 10 16 3"
            fill="none" stroke="#0E241E" stroke-width="2.4" stroke-linecap="round"/>
      <!-- ひげ -->
      <g stroke="#F4EEE3" stroke-width="1.8" stroke-linecap="round" opacity="0.85">
        <path d="M292 390 L246 382"/><path d="M292 396 L248 398"/>
        <path d="M340 390 L386 382"/><path d="M340 396 L384 398"/>
      </g>
    </g>
  </g>

  <!-- 窓枠 -->
  <path d="M150 560 L150 236 A170 170 0 0 1 490 236 L490 560"
        fill="none" stroke="#16140F" stroke-width="7"/>
  <line x1="320" y1="66" x2="320" y2="560" stroke="#16140F" stroke-width="4.5"/>
  <line x1="150" y1="330" x2="490" y2="330" stroke="#16140F" stroke-width="4.5"/>

  <!-- 右側の余白に置いた活字的な要素 -->
  <g fill="#16140F" opacity="0.9" font-family="Georgia, 'Times New Roman', serif">
    <text x="566" y="250" font-size="15" letter-spacing="5" opacity="0.55">01 / DUSK</text>
    <text x="566" y="316" font-size="62">Still</text>
    <text x="566" y="380" font-size="62" font-style="italic" fill="#B4502C">hours.</text>
  </g>
  <line x1="566" y1="410" x2="700" y2="410" stroke="#16140F" stroke-width="1.6" opacity="0.35"/>
  <text x="566" y="442" font-size="13.5" fill="#5A544A"
        font-family="system-ui, sans-serif" opacity="0.9">Where the small things live.</text>

  <!-- 床の影 -->
  <ellipse cx="320" cy="574" rx="190" ry="12" fill="#16140F" opacity="0.07"/>
</svg>
